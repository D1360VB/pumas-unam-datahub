name: Daily Pumas Bot

on:
  schedule:
    - cron: "0 15 * * *"   # 15:00 UTC = 9:00 AM CDMX
  workflow_dispatch:        # Permite ejecución manual

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Publish daily data to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot/bot_telegram.py

      - name: Commit bot state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/bot_state.json
          git diff --staged --quiet || git commit -m "bot: actualizar estado $(date -u +%F)"
          git push
